name: goreleaser

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify:
    name: Tests and dependency check
    uses: itzg/github-workflows/.github/workflows/go-test.yml@458a58e2c4d247563ea4bd7da4a28baec2c5f43e # main
    with:
      go-version-file: go.mod
      include-govulncheck: true

  container-tests:
    name: Container tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and test container
        run: bash test.sh

  codeql:
    name: Code scanning
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  goreleaser:
    needs: [verify, container-tests, codeql]
    permissions:
      contents: write
    uses: itzg/github-workflows/.github/workflows/go-with-releaser.yml@458a58e2c4d247563ea4bd7da4a28baec2c5f43e # main
    with:
      go-version-file: go.mod
      include-govulncheck: false
